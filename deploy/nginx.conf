# DurableFlow 反向代理示例。
# 重点：SSE 必须关闭代理缓冲，否则事件会被 Nginx 攒着，前端看不到实时输出。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream durableflow_api {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # SSE：单独匹配事件流接口。
        location ~ ^/api/runs/[0-9]+/events/stream$ {
            proxy_pass http://durableflow_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 关键三行：不缓冲、不缓存、不压缩。
            proxy_buffering off;
            proxy_cache off;
            gzip off;

            # 心跳 15s 一次；读超时要大于心跳间隔，长连接才不会被网关掐断。
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # 再给下游加一道保险（应用本身也会返回这个头）。
            add_header X-Accel-Buffering no always;
        }

        location / {
            proxy_pass http://durableflow_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
