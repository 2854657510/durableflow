services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: durableflow
      POSTGRES_PASSWORD: durableflow
      POSTGRES_DB: durableflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durableflow -d durableflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://durableflow:durableflow@postgres:5432/durableflow
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      LLM_PROVIDER: mock
      AUTO_CREATE_TABLES: "true"
      LOG_LEVEL: INFO
      WORKER_CONCURRENCY: "2"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 15

  worker:
    build: .
    command: python -m app.worker.main
    environment:
      DATABASE_URL: postgresql+psycopg://durableflow:durableflow@postgres:5432/durableflow
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      LLM_PROVIDER: mock
      AUTO_CREATE_TABLES: "true"
      LOG_LEVEL: INFO
      WORKER_ID: worker-docker
      WORKER_CONCURRENCY: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
