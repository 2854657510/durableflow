name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: durableflow
          POSTGRES_PASSWORD: durableflow
          POSTGRES_DB: durableflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U durableflow -d durableflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://durableflow:durableflow@localhost:5432/durableflow
      REDIS_URL: redis://localhost:6379/0
      REDIS_ENABLED: "true"
      LLM_PROVIDER: mock
      LOG_LEVEL: ERROR

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
